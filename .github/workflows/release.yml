name: Build & publish latest APK

# Every push to main rebuilds the keyless APK and refreshes the "latest" GitHub Release asset
# (SlyOS.apk). The website's download button points at releases/latest/download/SlyOS.apk — a stable
# link — so people ALWAYS get the newest build with zero manual steps.
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create/update the release

concurrency:
  group: latest-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK (keyless — no apikey.properties in CI, each user brings their own key)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :AgentShell:assembleDebug --no-daemon
          cp AgentShell/build/outputs/apk/debug/AgentShell-debug.apk "$GITHUB_WORKSPACE/SlyOS.apk"

      - name: Publish to the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A single rolling release tagged "latest" — always the newest build, stable download URL.
          # IMPORTANT: do NOT delete the release each push (that resets GitHub's download_count to 0).
          # Create it once if missing, then just replace the APK asset in place with --clobber.
          # APK trust: publish the SHA-256 so anyone can verify the download hasn't been tampered with.
          SHA=$(sha256sum "$GITHUB_WORKSPACE/SlyOS.apk" | cut -d' ' -f1)
          echo "SlyOS.apk SHA-256: $SHA"
          # NOTE: every line of this heredoc MUST stay indented inside the `run: |` block. A line at
          # column 0 ends the YAML block scalar and makes the whole workflow file invalid (which is
          # exactly what silently broke every run here — jobs failed in 0s with no logs).
          NOTES="$(cat <<EOF
          Auto-published from main. Install, then paste your own free Gemini or Anthropic key on first launch. Android 10+. Set SlyOS as your Home app when prompted.

          **Verify your download** — SlyOS.apk SHA-256:
          \`$SHA\`
          Run \`shasum -a 256 SlyOS.apk\` and confirm it matches before installing.
          EOF
          )"
          NOTES="$(printf '%s\n' "$NOTES" | sed 's/^          //')"
          # --latest on every run, and it is not optional.
          #
          # The website button points at releases/latest/download/SlyOS.apk, and GitHub resolves
          # that to whichever release is FLAGGED latest — not to the tag literally named "latest".
          # A manually published dated release (publish_release.sh) takes that flag, and from then
          # on CI kept faithfully rebuilding and uploading to a release nobody could download. The
          # site served a stale APK for days with every workflow run passing green.
          gh release view latest >/dev/null 2>&1 \
            && gh release edit latest --notes "$NOTES" --latest \
            || gh release create latest --title "SlyOS — latest build" --notes "$NOTES" --latest
          gh release upload latest "$GITHUB_WORKSPACE/SlyOS.apk" --clobber
