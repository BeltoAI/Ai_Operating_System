name: SlyOS
options:
  bundleIdPrefix: com.belto
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Swift 5 language mode on purpose: strict concurrency would flag the shared token store and
    # the observable state before either is worth designing around. Revisit once the brain lands.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SlyOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/SlyOSCompanion
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - target: ShareExtension
      - target: Keyboard
    # An explicit Info.plist rather than GENERATE_INFOPLIST_FILE.
    #
    # The INFOPLIST_KEY_* build settings only emit Apple's *known* keys — custom ones like
    # GoogleOAuthClientID are dropped silently, so every lookup returned empty and Google sign-in
    # and accounts were disabled at runtime with no error anywhere. Declaring the file outright is
    # the only way to ship our own keys.
    info:
      path: SlyOS-Info.plist
      properties:
        CFBundleDisplayName: SlyOS
        # Only standard HTTPS — declaring this stops every upload being held for export review.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        # Without a launch screen iOS runs the app letterboxed in a scaled compatibility window.
        UILaunchScreen: {}
        # SlyOS draws its own status line, as the Android launcher does.
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

        # Each of these backs a feature that visibly uses it — App Review rejects permissions the
        # app does not obviously need.
        NSCameraUsageDescription: SlyOS uses the camera when you open Look mode to identify, read, and remember what you point at.
        NSMicrophoneUsageDescription: SlyOS uses the microphone only when you choose voice input or a voice workflow.
        NSSpeechRecognitionUsageDescription: SlyOS transcribes speech only after you tap the voice control.
        NSPhotoLibraryUsageDescription: SlyOS reads photos you explicitly choose for Look, document, receipt, and memory workflows.
        NSPhotoLibraryAddUsageDescription: SlyOS saves a document or image to your photos only when you ask it to.
        NSCalendarsFullAccessUsageDescription: SlyOS reads your calendar only when you ask about your schedule and writes events only after a confirmed request.
        NSRemindersFullAccessUsageDescription: SlyOS reads and writes reminders only for reminder workflows you explicitly request.
        NSContactsUsageDescription: SlyOS searches your contacts only when a prompt needs a person, phone number, or email address.
        NSLocationWhenInUseUsageDescription: SlyOS uses your location when you ask something about where you are, or ask it to share your location.
        NSFaceIDUsageDescription: SlyOS can lock your brain behind Face ID so only you can read it.

        # Ours, resolved from Secrets.xcconfig at build time so real values never enter git.
        # Empty means the feature says so in the UI rather than failing obscurely.
        GoogleOAuthClientID: $(GOOGLE_OAUTH_CLIENT_ID)
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belto.slyos.ios
        PRODUCT_NAME: SlyOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SlyOS.entitlements

  # The keyboard: reply drafting inside whatever app you're typing in. As close as iOS permits to
  # what Android does from a notification — it can read its own text field and insert text, but no
  # entitlement lets any app press send in another app.
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: PrivacyInfo.xcprivacy
      - path: Sources/SlyOSCompanion/SlyTheme.swift
      - path: Sources/SlyOSCompanion/SlyCard.swift
      - path: Sources/SlyOSCompanion/SlyOrbit.swift
      - path: Sources/SlyOSCompanion/SlyStore.swift
      - path: Sources/SlyOSCompanion/SharedContainer.swift
      - path: Sources/SlyOSCompanion/Keychain.swift
      - path: Sources/SlyOSCompanion/ModelRouter.swift
      - path: Sources/SlyOSCompanion/AgentClient.swift
      - path: Sources/SlyOSCompanion/SlySettings.swift
      - path: Sources/SlyOSCompanion/SlyProfile.swift
      - path: Sources/SlyOSCompanion/OpenClawPolicy.swift
      - path: Sources/SlyOSCompanion/DraftLog.swift
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belto.slyos.ios.keyboard
        PRODUCT_NAME: SlyOSKeyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SlyOS
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: SlyOS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: en-US
            PrefersRightToLeft: false
            IsASCIICapable: false
            # Full Access: the network, to reach the model, and the App Group, to read the brain.
            # Without it the keyboard can type but knows nothing, and it says so on screen.
            RequestsOpenAccess: true

  # Reply drafting. iOS forbids reading other apps' notifications, so the honest equivalent is
  # selecting a message anywhere and sharing it here. Runs in its own process, which is why the
  # brain lives in an App Group container both targets can reach.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: PrivacyInfo.xcprivacy
      # Only what the extension actually needs. Permissions, Importers, LookMode and the panels are
      # deliberately excluded: they reach UIApplication.shared and heavy frameworks an extension
      # neither may use nor needs.
      - path: Sources/SlyOSCompanion/SlyTheme.swift
      - path: Sources/SlyOSCompanion/SlyStore.swift
      - path: Sources/SlyOSCompanion/SharedContainer.swift
      - path: Sources/SlyOSCompanion/Keychain.swift
      - path: Sources/SlyOSCompanion/ModelRouter.swift
      - path: Sources/SlyOSCompanion/AgentClient.swift
      # The extension drafts replies to text from other apps — the one place prompt injection is
      # most likely — so the untrusted-content rules travel with it.
      - path: Sources/SlyOSCompanion/OpenClawPolicy.swift
      - path: Sources/SlyOSCompanion/SlySettings.swift
      - path: Sources/SlyOSCompanion/SlyProfile.swift
      - path: Sources/SlyOSCompanion/DraftLog.swift
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belto.slyos.ios.share
        # Distinct from the app's: two targets producing a module called SlyOS collide on the
        # .swiftmodule outputs. The display name below is what the user actually sees.
        PRODUCT_NAME: SlyOSShare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SlyOS
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    info:
      path: ShareExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
